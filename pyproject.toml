[project]
name = "monoconf"
version = "0.1.0"
description = "One pydantic model, one CLI, one env reader, one layered TOML loader, one precedence order."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# 2.8 is the oldest release the whole suite passes on; CI's pydantic-floor job
# holds it there. Before it, pydantic mishandles a builtin such as str.strip used
# as a BeforeValidator, which breaks monoconf's definition-time type probe.
dependencies = ["pydantic>=2.8"]
keywords = ["configuration", "config", "cli", "argparse", "toml", "environment", "pydantic"]
authors = [{ name = "monoconf contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mushroomsoftca/monoconf"
Repository = "https://github.com/mushroomsoftca/monoconf"
Issues = "https://github.com/mushroomsoftca/monoconf/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "hypothesis"]

[build-system]
# 1.27 is the first to write a PEP 639 licence expression into the metadata.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monoconf"]

# The sdist carries what it takes to build, test and read the package, and none of
# the repository's own tooling: CI, agent instructions, the lockfile.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/PLAN.md",
  "/LICENSE",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# PLAN.md is a design document; its Python blocks are illustrative and must not
# be reformatted into working-code style.
exclude = ["*.md"]

[tool.ruff.lint]
# Ruff defaults (E4, E7, E9, F) plus the sets AGENTS.md names.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF012 flags `tags: list[str] = []`, which is the documented way to declare an
# optional list field. pydantic copies a model's defaults per instance, so the
# sharing the rule warns about cannot happen here. Ruff exempts classes it can see
# inherit from BaseModel, but not ones inheriting monoconf.Config -- which is every
# model in this repository, and in every application using it.
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["monoconf"]
branch = true

[tool.coverage.report]
show_missing = true
# Floor, not a target; PLAN.md targets 90 overall and 100 for merge.py/schema.py.
fail_under = 85
