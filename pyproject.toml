[project]
name = "monoconf"
version = "0.1.0.dev0"
description = "One pydantic model, one CLI, one env reader, one layered TOML loader, one precedence order."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["pydantic>=2.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monoconf"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# PLAN.md is a design document; its Python blocks are illustrative and must not
# be reformatted into working-code style.
exclude = ["*.md"]

[tool.ruff.lint]
# Ruff defaults (E4, E7, E9, F) plus the sets AGENTS.md names.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF012 flags `tags: list[str] = []`, which is the documented way to declare an
# optional list field. pydantic copies a model's defaults per instance, so the
# sharing the rule warns about cannot happen here. Ruff exempts classes it can see
# inherit from BaseModel, but not ones inheriting monoconf.Config -- which is every
# model in this repository, and in every application using it.
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["monoconf"]
branch = true

[tool.coverage.report]
show_missing = true
# Floor, not a target; PLAN.md targets 90 overall and 100 for merge.py/schema.py.
fail_under = 85
